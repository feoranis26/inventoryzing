services:
  db:
    image: ${IZ_RESTORE_POSTGRES_IMAGE:-postgres:18.3-alpine}
    environment:
      POSTGRES_DB: ${IZ_RESTORE_DATABASE:?Set IZ_RESTORE_DATABASE}
      POSTGRES_USER: inventoryzing
      POSTGRES_PASSWORD: ${IZ_RESTORE_OWNER_PASSWORD:?Set IZ_RESTORE_OWNER_PASSWORD}
    volumes:
      - restore-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventoryzing -d ${IZ_RESTORE_DATABASE}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
  migrate:
    image: ${IZ_RESTORE_APPLICATION_IMAGE:-inventoryzing-coordinator:local}
    environment:
      IZ_DATABASE_URL: postgresql+psycopg://inventoryzing:${IZ_RESTORE_OWNER_PASSWORD}@db:5432/${IZ_RESTORE_DATABASE}
      IZ_RUNTIME_PASSWORD: ${IZ_RESTORE_RUNTIME_PASSWORD:?Set IZ_RESTORE_RUNTIME_PASSWORD}
    command: ["python", "-m", "inventoryzing.migrate"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

volumes:
  restore-data: